name: HELIOS tests and container build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packages
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -v
      - name: Compile all Python files
        run: python -m compileall -q helios main.py train.py run_cycle.py
      - name: Build image
        run: docker build -t helios:ci .
